<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Pluck sound tests – GarageBox - Music Sandbox</title>
    <style>
      body { background: #0e0f12; color: #e8eaed; font: 14px/1.5 ui-monospace, monospace; padding: 16px; }
      .pass { color: #3dd68c; }
      .fail { color: #ff6369; }
    </style>
  </head>
  <body>
    <h1>Pluck sound tests (OfflineAudioContext)</h1>
    <p>Renders the Karplus-Strong worklet offline and checks level, pitch, decay and mute fade. Open via a local server at <code>/tests/pluck.test.html</code>.</p>
    <p id="summary"></p>
    <ul id="results"></ul>
    <script type="module">
      import { createSuite } from './test-runner.js';
      import { PluckSource } from '../src/js/audio/pluck-source.js';

      const s = createSuite('pluck tests');
      const { check } = s;
      const RATE = 48000;

      function rms(data, from, to) {
        let sum = 0;
        const a = Math.floor(from * RATE);
        const b = Math.floor(to * RATE);
        for (let i = a; i < b; i++) sum += data[i] * data[i];
        return Math.sqrt(sum / Math.max(1, b - a));
      }

      /** Estimates the fundamental frequency (50-1000 Hz) by autocorrelation. */
      function frequency(data, from, to) {
        const a = Math.floor(from * RATE);
        const n = Math.min(Math.floor((to - from) * RATE), 8192);
        let best = 0;
        let bestLag = 1;
        for (let lag = Math.floor(RATE / 1000); lag <= Math.ceil(RATE / 50); lag++) {
          let sum = 0;
          for (let i = 0; i < n; i++) sum += data[a + i] * data[a + i + lag];
          if (sum > best) {
            best = sum;
            bestLag = lag;
          }
        }
        return RATE / bestLag;
      }

      function peak(data) {
        let p = 0;
        for (const v of data) p = Math.max(p, Math.abs(v));
        return p;
      }

      /**
       * Renders `seconds` of audio. `steps` is a list of [time, fn(source)]:
       * the rendering is suspended at each time, the messages are posted, and
       * it resumes after a short wait so the worklet has received them.
       */
      async function render(seconds, steps, params = { decay: 4, brightness: 0.3 }) {
        const ctx = new OfflineAudioContext(1, seconds * RATE, RATE);
        const source = new PluckSource(ctx, ctx.destination, params);
        await source.ready;
        const wait = () => new Promise((r) => setTimeout(r, 30));
        for (const [time, fn] of steps) {
          ctx.suspend(time).then(async () => {
            fn(source);
            await wait();
            ctx.resume();
          });
        }
        return (await ctx.startRendering()).getChannelData(0);
      }

      try {
        const ring = await render(3, [[0, (src) => src.noteOn(1, 57, 100)]]); // A3 = 220 Hz
        check('a plucked note is audible', rms(ring, 0.05, 0.25) > 0.02, true);
        const f = frequency(ring, 0.5, 1.5);
        check(`pitch of A3 is about 220 Hz (measured ${f.toFixed(1)})`, Math.abs(f - 220) < 3, true);
        check('the note decays naturally (R4.7)', rms(ring, 2.5, 3) < rms(ring, 0.05, 0.25) / 4, true);
        check('no clipping', peak(ring) <= 1, true);

        const muted = await render(1.5, [
          [0, (src) => src.noteOn(1, 57, 100)],
          [0.5, (src) => src.noteOff(1, 0.2)], // mute after 0.5 s with a 0.2 s fade
        ]);
        check('a muted note is silent after its fade (R4.3.1)', rms(muted, 0.75, 1.5) < 1e-4, true);
        check('the fade is soft, not a hard cut', rms(muted, 0.6, 0.65) > rms(muted, 0.45, 0.5) * 0.1, true);

        const bent = await render(1.5, [
          [0, (src) => {
            src.bend(-12);
            src.noteOn(1, 57, 100);
          }],
        ]);
        const fb = frequency(bent, 0.5, 1.4);
        check(`a bend of -12 semitones halves the pitch (measured ${fb.toFixed(1)} Hz)`, Math.abs(fb - 110) < 3, true);

        const chord = await render(1, [
          [0, (src) => {
            for (const [i, m] of [52, 55, 57, 59, 62].entries()) src.noteOn(i + 1, m, 127);
          }],
        ]);
        check('a five-note chord at full velocity stays below 1.0', peak(chord) <= 1, true);
      } catch (err) {
        check(`rendering works (${err})`, false, true);
      }
      s.finish();
    </script>
  </body>
</html>
