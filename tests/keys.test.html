<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Keys logic tests – Music Sandbox</title>
    <style>
      body { background: #0e0f12; color: #e8eaed; font: 14px/1.5 ui-monospace, monospace; padding: 16px; }
      .pass { color: #3dd68c; }
      .fail { color: #ff6369; }
    </style>
  </head>
  <body>
    <h1>Keys (computer keyboard) logic tests</h1>
    <p>Open via a local server (e.g. <code>python3 -m http.server</code>) at <code>/tests/keys.test.html</code>.</p>
    <p id="summary"></p>
    <ul id="results"></ul>
    <script type="module">
      import { createSuite, edge, summarize } from './test-runner.js';
      import { Keys, KEY_OFFSETS } from '../js/instruments/keys.js';
      import { KeyboardDevice, KEY_CONTROLS } from '../js/input/keyboard-input.js';
      import { noteName } from '../js/audio/theory.js';

      const s = createSuite('keys tests');
      const { check } = s;
      const notes = (events) => summarize(events).filter((e) => !e.startsWith('bend') && !e.startsWith('volume'));
      const play = (k, edges) => notes(k.handle(edges, {}, 0));
      const down = (code) => edge(`note:${code}`, 'pressed');
      const up = (code) => edge(`note:${code}`, 'released');

      s.group('musical typing layout (R4c.4)');
      const k0 = new Keys();
      check('home row A..L = C4..D5', ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL'].map((c) => noteName(k0.noteFor(c))), ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5']);
      check('row above W E T Y U O P = black keys', ['KeyW', 'KeyE', 'KeyT', 'KeyY', 'KeyU', 'KeyO', 'KeyP'].map((c) => noteName(k0.noteFor(c))), ['C#4', 'D#4', 'F#4', 'G#4', 'A#4', 'C#5', 'D#5']);
      check('bottom row Z..M = C3..B3, one octave lower', ['KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM'].map((c) => noteName(k0.noteFor(c))), ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3']);
      check('Q, R and I play nothing', ['KeyQ', 'KeyR', 'KeyI'].map((c) => k0.noteFor(c)), [null, null, null]);

      s.group('piano behavior (R4c.9)');
      let k = new Keys();
      check('key down plays C4', play(k, [down('KeyA')]), ['on:60@60']);
      const off = k.handle([up('KeyA')], {}, 0);
      check('key up stops it', notes(off), ['off']);
      check('with a short soft release (0.15 s)', off[0].fade, 0.15);
      check('two keys at once: two notes', play(k, [down('KeyA'), down('KeyD')]), ['on:60@60', 'on:64@64']);
      check('releasing one stops only that one', play(k, [up('KeyA')]), ['off']);
      check('unknown keys are ignored', play(k, [down('KeyQ'), edge('note:Foo')]), []);

      s.group('octave shift (R4c.8)');
      k = new Keys();
      check('Shift held: one octave up', play(k, [edge('octaveUp'), down('KeyA')]), ['on:72@72']);
      check('releasing Shift keeps the ringing note', play(k, [edge('octaveUp', 'released')]), []);
      check('the next note is back in the normal octave', play(k, [down('KeyS')]), ['on:62@62']);
      check('Alt held: one octave down', play(k, [edge('octaveDown'), down('KeyD')]), ['on:52@52']);
      check('Shift and Alt together cancel out', play(k, [edge('octaveUp'), down('KeyF')]), ['on:65@65']);
      check('modifier pressed in the same frame as the key applies', play(new Keys(), [down('KeyA'), edge('octaveUp')]), ['on:72@72']);

      s.group('sustain pedal (R4c.10)');
      k = new Keys();
      play(k, [edge('sustain')]);
      play(k, [down('KeyA')]);
      check('released key keeps ringing while Space is held', play(k, [up('KeyA')]), []);
      play(k, [down('KeyD')]);
      check('pedal up stops released keys only', play(k, [edge('sustain', 'released')]), ['off']);
      check('the held key still rings and stops on key up', play(k, [up('KeyD')]), ['off']);
      k = new Keys();
      play(k, [edge('sustain'), down('KeyA')]);
      play(k, [up('KeyA')]);
      check('pressing a sustained key again restarts it', play(k, [down('KeyA')]), ['off', 'on:60@60']);
      check('it is held now, so it survives the pedal coming up', play(k, [edge('sustain', 'released')]), []);

      s.group('guitar on keys 1-5 and Backspace (R4c.3)');
      k = new Keys();
      check('1 + Backspace plays green (E3) on the guitar part', play(k, [edge('fret1'), edge('strum')]), ['on:52@0/guitar']);
      check('strum again restarts it (R4.4)', play(k, [edge('strum', 'released'), edge('strum')]), ['off/guitar', 'on:52@0/guitar']);
      check('pressing 1 again mutes it (R4.3)', play(k, [edge('fret1', 'released'), edge('fret1')]), ['off/guitar']);
      check('piano and guitar play at the same time', play(k, [edge('fret1', 'released'), edge('fret3'), edge('strum', 'released'), edge('strum'), down('KeyA')]), ['on:60@60', 'on:57@2/guitar']);
      k.configure({ guitar: { notes: [57, 60, 62, 64, 67] } });
      check('guitar key follows the settings', k.guitar.noteFor(0), 57);
      check('stopAll stops piano and guitar', notes(k.stopAll()), ['off', 'off/guitar']);
      check('after stopAll nothing rings', notes(k.stopAll()), []);

      s.group('keyboard input (design 3.2, R4c.7)');
      const kb = new KeyboardDevice();
      const ev = (code, opts = {}) => ({ code, repeat: false, ctrlKey: false, metaKey: false, target: document.body, prevented: false, preventDefault() { this.prevented = true; }, ...opts });
      let e = ev('KeyA');
      kb._key(e, true);
      kb.poll();
      check('KeyA down -> note:KeyA pressed', kb.controlEdges.map((x) => `${x.name}:${x.type}`), ['note:KeyA:pressed']);
      check('default action is prevented', e.prevented, true);
      kb._key(ev('KeyA', { repeat: true }), true);
      kb.poll();
      check('auto-repeat is ignored', kb.controlEdges, []);
      kb._key(ev('KeyA'), false);
      kb._key(ev('Space'), true);
      kb._key(ev('Backspace'), true);
      kb._key(ev('Digit3'), true);
      kb.poll();
      check('several keys in one frame keep their order', kb.controlEdges.map((x) => `${x.name}:${x.type}`), ['note:KeyA:released', 'sustain:pressed', 'strum:pressed', 'fret3:pressed']);
      kb._key(ev('ShiftLeft'), true);
      kb._key(ev('ShiftRight'), true);
      kb._key(ev('ShiftLeft'), false);
      kb.poll();
      check('octaveUp stays on while either Shift is down', kb.controlEdges.map((x) => `${x.name}:${x.type}`), ['octaveUp:pressed']);
      e = ev('KeyW', { ctrlKey: true });
      kb._key(e, true);
      kb.poll();
      check('Ctrl+W is left to the browser', [kb.controlEdges.length, e.prevented], [0, false]);
      const select = document.createElement('select');
      document.body.append(select);
      e = ev('KeyS', { target: select });
      kb._key(e, true);
      kb.poll();
      check('keys typed into a form field are ignored', [kb.controlEdges.length, e.prevented], [0, false]);
      kb.releaseAll();
      kb.poll();
      check('releaseAll releases everything that is down', kb.controlEdges.map((x) => x.name).sort(), ['fret3', 'octaveUp', 'strum', 'sustain']);
      check('Alt keys are octave down', [KEY_CONTROLS.AltLeft, KEY_CONTROLS.AltRight], ['octaveDown', 'octaveDown']);
      check('every musical typing key has a control', Object.keys(KEY_OFFSETS).every((c) => KEY_CONTROLS[c] === `note:${c}`), true);

      s.finish();
    </script>
  </body>
</html>
