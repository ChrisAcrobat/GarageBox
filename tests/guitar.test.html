<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Guitar logic tests – GarageBox - Music Sandbox</title>
    <style>
      body { background: #0e0f12; color: #e8eaed; font: 14px/1.5 ui-monospace, monospace; padding: 16px; }
      .pass { color: #3dd68c; }
      .fail { color: #ff6369; }
      #sandbox { position: relative; width: 420px; }
    </style>
  </head>
  <body>
    <h1>Guitar logic tests</h1>
    <p>Pure guitar logic plus the settings and level-estimate code it depends on (design 9.2). See <a href="./README.md">tests/README.md</a> for how to run the pages.</p>
    <p id="summary"></p>
    <ul id="results"></ul>
    <div id="sandbox"></div>
    <script type="module">
      import { createSuite, edge, summarize } from './test-runner.js';

      const s = createSuite('guitar tests', { timeoutMs: 50000 });
      const { check } = s;

      // Every module is loaded dynamically: a missing module or export is a FAIL, not a hang.
      const G = await s.load('../src/js/instruments/guitar.js', ['Guitar', 'GAMEPAD_GUITAR_CONTROLS', 'deflection', 'stepDelta', 'shiftInScale', 'displayOffset', 'splitOffset', 'glidePitch', 'TILT_STEP_SIZE', 'TILT_STEP_HYSTERESIS', 'STEP_LIMIT_OCTAVES', 'TILT_STARTS_ENABLED']);
      const SETUP = await s.load('../src/js/instruments/setup.js', ['guitarOptions', 'guitarSound', 'createInstrument', 'soundCycle', 'DEFAULT_SOURCES', 'DEFAULT_PROGRAMS', 'drumOptions']);
      const TH = await s.load('../src/js/audio/theory.js', ['SCALES', 'guitarRootMidi', 'scaleNotes', 'noteName']);
      const ST = await s.load('../src/js/settings/store.js', ['DEFAULTS', 'getDeviceSettings', 'setDeviceSetting', 'resetDeviceSettings', 'getGlobalSettings', 'setGlobalSetting']);
      const BH = await s.load('../src/js/input/back-hold.js', ['BackHold', 'BACK_HOLD_SECONDS', 'BACK_FULL_RESET_SECONDS']);
      const SV = await s.load('../src/js/visual/simple-view.js', ['guitarLabelStrip', 'orientationBars', 'ORIENTATION_COLOR', 'FRET_COLORS']);
      const AE = await s.load('../src/js/audio/audio-engine.js', ['VoiceTracker', 'trackerConfig']);
      const HV = await s.load('../src/js/visual/highway-view.js', ['HighwayState']);
      const MS = await s.load('../src/js/audio/midi-source.js', ['MidiSource']);
      const MAP = await s.load('../src/js/input/mappings.js', ['MAPPINGS', 'selectMapping']);
      const DET = await s.load('../src/js/input/detect.js', ['detectController']);
      const PANEL = await s.load('../src/js/ui/settings-panel.js', ['SettingsPanel']);
      const NAV = await s.load('../src/js/ui/menu-nav.js', ['MENU_CONTROLS', 'intentFor']);
      const KEYS = await s.load('../src/js/instruments/keys.js', ['Keys']);
      const DR = await s.load('../src/js/instruments/drums.js', ['Drums']);
      const I18N = await s.load('../src/js/i18n/i18n.js', ['setLanguage', 't']);
      const LA = await s.load('../src/js/ui/lane-actions.js', ['rangeShiftedChange', 'dpadChange']);
      const { Guitar, GAMEPAD_GUITAR_CONTROLS } = G;
      const { guitarOptions, guitarSound } = SETUP;
      const { noteName, scaleNotes, SCALES } = TH;
      const DEFAULTS = ST.DEFAULTS || { device: {}, global: {} };

      // ---- helpers ----------------------------------------------------------
      const press = (n) => edge(n, 'pressed');
      const release = (n) => edge(n, 'released');
      const strum = press('strumDown');
      // Plays one frame; only note events and actions (bend/volume/holdEnd/glide/starPower filtered unless asked).
      function play(g, edges, controls = {}, { all = false, t = 0 } = {}) {
        const ev = summarize(g.handle(edges, controls, t));
        return ev.filter((e) => !(all ? /^starPower/ : /^(bend|volume|holdEnd|glide|starPower)/).test(e));
      }
      const ev = (out, type) => out.filter((e) => e.type === type);
      const actions = (out) => out.filter((e) => e.type === 'action');
      const ctl = (whammy, tilt) => ({ whammy: { value: whammy, pressed: whammy > 0.5 }, tilt: { value: tilt, pressed: tilt > 0.9 } });
      // Tilt values with tiltSmoothing 0, so each reading is taken as is.
      const tg = (extra = {}) => new Guitar({ tiltSmoothing: 0, ...extra });
      const tilt = (h, v, t = 0) => h.handle([], ctl(0, v), t);
      const tapBack = (h, v, t = 0) => { h.handle([press('back')], ctl(0, v), t); return h.handle([release('back')], ctl(0, v), t); };
      const notes = (h) => [0, 1, 2, 3, 4].map((i) => noteName(h.noteFor(i)));
      const noBendVol = (list) => list.filter((e) => !e.startsWith('bend') && !e.startsWith('volume'));
      // Back held from t0 to t1 (frames every 0.5 s), released 0.1 s later. Raw events.
      function hold(h, t0, t1, v = 0.44) {
        const held = [...h.handle([press('back')], ctl(0, v), t0)];
        for (let t = t0 + 0.5; t < t1 - 1e-9; t += 0.5) held.push(...h.handle([], ctl(0, v), t));
        held.push(...h.handle([], ctl(0, v), t1));
        const rel = h.handle([release('back')], ctl(0, v), t1 + 0.1);
        const f = (list) => noBendVol(summarize(list));
        return { held: f(held), release: f(rel), heldRaw: held, releaseRaw: rel };
      }
      const resets = (list) => list.filter((e) => e.type === 'action' && e.action === 'resetSettings').map((e) => e.full);
      // Settings ids used here; withCleanStorage restores the real localStorage afterwards.
      const sandbox = document.getElementById('sandbox');
      const fakeDevice = (id, name, extra = {}) => {
        const detection = DET.detectController ? DET.detectController(name) : { type: 'gamepad', mapping: 'gamepad-standard' };
        return { id, settingsId: id, index: 0, detection, mapping: MAP.selectMapping?.(detection.type, 'standard'), ...extra };
      };
      const XPLORER = 'RedOctane Inc(c)2006  Guitar Hero X-plorer   (STANDARD GAMEPAD Vendor: 1430 Product: 4748)';
      const PAD = 'Xbox 360 Controller (XInput STANDARD GAMEPAD)';
      function openPanel(device, kind, instrument, extra = {}) {
        return new PANEL.SettingsPanel({ container: sandbox, device, getInstrument: () => ({ kind, instrument }), onClose: () => {}, onOpenDebug: () => {}, focus: false, ...extra });
      }
      const storedAnywhere = (id) => Object.keys(localStorage).some((k) => (localStorage.getItem(k) || '').includes(JSON.stringify(id)));

      // ---- basics -----------------------------------------------------------
      await s.section('basics (R4.1, R4.9)', () => {
        const g = new Guitar();
        check('strum with no fret held plays nothing', play(g, [strum]), []);
        check('fret press alone plays nothing', play(g, [press('fret1')]), []);
        check('hold green + strum plays E3 (52)', play(g, [strum]), ['on:52@0']);
        check('strum up also plays', play(new Guitar(), [press('fret2'), press('strumUp')]), ['on:55@1']);
        check('default notes are E minor pentatonic E3 G3 A3 B3 D4', g.options.notes.map(noteName), ['E3', 'G3', 'A3', 'B3', 'D4']);
      });

      await s.section('restrum (R4.4)', () => {
        const g = new Guitar();
        play(g, [press('fret1')]);
        const twice = [...play(g, [strum]), ...play(g, [release('strumDown')]), ...play(g, [strum])];
        check('strum twice without release gives two noteOn and one noteOff', twice, ['on:52@0', 'off', 'on:52@0']);
        check('the noteOff stops the first voice', () => {
          const h = new Guitar();
          h.handle([press('fret1')], {}, 0);
          const first = h.handle([strum], {}, 0).find((e) => e.type === 'noteOn');
          h.handle([release('strumDown')], {}, 0);
          const second = h.handle([strum], {}, 0);
          return second.find((e) => e.type === 'noteOff').voiceId === first.voiceId && second.find((e) => e.type === 'noteOn').voiceId !== first.voiceId;
        }, true);
      });

      await s.section('release keeps ringing, mute on press-down (R4.2, R4.3, R4.3.1, R4.7)', () => {
        const g = new Guitar();
        play(g, [press('fret1')]);
        play(g, [strum]);
        check('releasing the fret sends nothing', play(g, [release('fret1')]), []);
        check('the voice is still tracked as ringing', g.ringingVoices()[0] !== null, true);
        const offs = ev(g.handle([press('fret1')], {}, 0), 'noteOff');
        check('pressing the fret of a ringing note sends one noteOff', offs.length, 1);
        check('the noteOff uses the mute fade-out of the options', offs[0]?.fade, g.options.fade);
        check('pressing again does not start a new note', play(g, [release('fret1'), press('fret1')]), []);
        check('fade time follows the setting', new Guitar({ fade: 0.3 }).options.fade, 0.3);
        check('default settings: mute fade-out 500 ms -> fade 0.5 s (R4.3.1)', () => guitarOptions(DEFAULTS.device, 'guitar').fade, 0.5);
      });

      await s.section('independent frets, chords, same frame (R4.6, R4.8)', () => {
        let g = new Guitar();
        play(g, [press('fret1')]);
        play(g, [strum]);
        play(g, [release('fret1'), press('fret2'), release('strumDown')]);
        check('strum only retriggers held frets; green keeps ringing', play(g, [strum]), ['on:55@1']);
        check('both frets have a ringing voice', g.ringingVoices().slice(0, 2).every((v) => v !== null), true);
        g = new Guitar();
        check('three held frets play together', play(g, [press('fret1'), press('fret3'), press('fret5'), strum]), ['on:52@0', 'on:57@2', 'on:62@4']);
        g = new Guitar();
        check('strum up and down in one frame = one strum', play(g, [press('fret1'), press('strumUp'), press('strumDown')]), ['on:52@0']);
        check('fret press + strum in one frame: mute old, play new', play(g, [release('fret1'), release('strumUp'), release('strumDown')]).concat(play(g, [press('fret1'), strum])), ['off', 'on:52@0']);
      });

      await s.section('Back and Start (R4.10, R4.11, R4.5.3)', () => {
        let g = new Guitar();
        play(g, [press('fret1'), press('fret2'), strum]);
        check('Back does not mute (press and release send no noteOff)', [...play(g, [press('back')]), ...play(g, [release('back')])].filter((e) => e === 'off'), []);
        check('ringing notes keep ringing after Back', g.ringingVoices().slice(0, 2).every((v) => v !== null), true);
        g = tg();
        tilt(g, 0.44);
        check('Back toggles tilt on release, not on press', [actions(g.handle([press('back')], ctl(0, 0.44), 0)).length, actions(g.handle([release('back')], ctl(0, 0.44), 0)).map((a) => [a.action, a.enabled])], [0, [['tiltToggled', true]]]);
        check('the next press/release toggles it off again', [actions(g.handle([press('back')], ctl(0, 0.44), 0)).length, actions(g.handle([release('back')], ctl(0, 0.44), 0)).map((a) => [a.action, a.enabled])], [0, [['tiltToggled', false]]]);
        g = new Guitar();
        g.setTapToPlay(false); // mouse-opened panel: tap mode stays off
        check('tap mode off (mouse-opened panel): Back toggles tilt, no mute', [...play(g, [press('back')]), ...play(g, [release('back')])], ['action:tiltToggled']);
        check('Start asks to open the settings', play(new Guitar(), [press('start')]), ['action:openSettings']);
      });

      await s.section('key and scale, bass octave (R4.9, R2.10)', () => {
        check('E root = E3 (52)', TH.guitarRootMidi(4), 52);
        check('A root = A3 (57)', TH.guitarRootMidi(9), 57);
        check('B root = B2 (47), within half an octave of E3', TH.guitarRootMidi(11), 47);
        check('A# root = A#3 (58), the highest root', TH.guitarRootMidi(10), 58);
        check('G root = G3 (55)', TH.guitarRootMidi(7), 55);
        check('A minor pentatonic', scaleNotes(57, 'minorPentatonic').map(noteName), ['A3', 'C4', 'D4', 'E4', 'G4']);
        check('E major pentatonic', scaleNotes(52, 'majorPentatonic').map(noteName), ['E3', 'F#3', 'G#3', 'B3', 'C#4']);
        check('C major plays its first five notes', scaleNotes(48, 'major').map(noteName), ['C3', 'D3', 'E3', 'F3', 'G3']);
        check('blues plays its first five notes', scaleNotes(52, 'blues').map(noteName), ['E3', 'G3', 'A3', 'A#3', 'B3']);
        check('options from default settings', () => guitarOptions({ ...DEFAULTS.device }, 'guitar').notes, [52, 55, 57, 59, 62]);
        check('bass is one octave lower (R2.10)', () => guitarOptions({ ...DEFAULTS.device }, 'bass').notes, [40, 43, 45, 47, 50]);
        const g = new Guitar();
        play(g, [press('fret1'), strum]);
        g.configure({ notes: scaleNotes(57, 'minorPentatonic'), rootMidi: 57 });
        check('changing the key keeps ringing notes and plays the new notes', play(g, [release('strumDown'), strum]), ['off', 'on:57@0']);
      });

      await s.section('octave setting (R4.13)', () => {
        check('octave default 0', DEFAULTS.device.octave, 0);
        check('octave +1 moves the guitar notes up 12', () => guitarOptions({ ...DEFAULTS.device, octave: 1 }, 'guitar').notes, [64, 67, 69, 71, 74]);
        check('octave -1 on the bass: E1 ..', () => guitarOptions({ ...DEFAULTS.device, octave: -1 }, 'bass').notes, [28, 31, 33, 35, 38]);
        check('a guitar built with octave +1 plays E4 on green', () => play(new Guitar(guitarOptions({ ...DEFAULTS.device, octave: 1 }, 'guitar')), [press('fret1'), strum]), ['on:64@0']);
      });

      await s.section('gamepad guitar mode (R2.10)', () => {
        let g = new Guitar({ controlNames: GAMEPAD_GUITAR_CONTROLS });
        check('A + D-pad down plays green', play(g, [press('faceA'), press('dpadDown')]), ['on:52@0']);
        check('B, Y, X, LB are red, yellow, blue, orange', play(g, [release('dpadDown'), press('faceB'), press('faceY'), press('faceX'), press('shoulderL'), press('dpadUp')]).filter((e) => e.startsWith('on')), ['on:52@0', 'on:55@1', 'on:57@2', 'on:59@3', 'on:62@4']);
        check('the raw guitar names do nothing on a gamepad', play(new Guitar({ controlNames: GAMEPAD_GUITAR_CONTROLS }), [press('fret1'), press('strumDown')]), []);
        check('no whammy/tilt control: no bend, full volume', summarize(new Guitar({ controlNames: GAMEPAD_GUITAR_CONTROLS }).handle([], {}, 0)), ['bend:0.00', 'volume:1.00']);
        check('D-pad left/right are part of the gamepad guitar controls (R4.15)', [GAMEPAD_GUITAR_CONTROLS.dpadLeft, GAMEPAD_GUITAR_CONTROLS.dpadRight], ['dpadLeft', 'dpadRight']);
      });

      await s.section('whammy assignment; the tilt has no sound effect (R4.5, R4.5.2)', () => {
        let g = new Guitar();
        check('at rest (whammy 0, tilt flat 0.44): no bend, full volume', play(g, [], ctl(0, 0.44), { all: true }), ['bend:0.00', 'volume:1.00']);
        check('unchanged values send nothing', play(g, [], ctl(0, 0.44), { all: true }), []);
        check('full whammy bends down 2 semitones (default)', play(g, [], ctl(1, 0.44), { all: true }), ['bend:-2.00']);
        check('half whammy bends 1 semitone', play(g, [], ctl(0.5, 0.44), { all: true }), ['bend:-1.00']);
        check('neck straight up changes nothing (no bend/volume)', play(g, [], ctl(0.5, 1), { all: true }), []);
        check('tilt deflection: flat -> 0', G.deflection('tilt', 0.44), 0);
        g = new Guitar({ whammy: 'volume', bendRange: 12 });
        check('whammy volume: at rest half volume, full whammy full volume', [play(g, [], ctl(0, 0.44), { all: true }), play(g, [], ctl(1, 0.44), { all: true })], [['bend:0.00', 'volume:0.50'], ['volume:1.00']]);
        g = new Guitar({ whammy: 'off' });
        check('whammy off: no bend, full volume', play(g, [], ctl(1, 1), { all: true }), ['bend:0.00', 'volume:1.00']);
        g = new Guitar();
        play(g, [], ctl(1, 0.44));
        g.configure({ whammy: 'off' });
        check('changing the assignment re-sends bend and volume', play(g, [], ctl(1, 0.44), { all: true }), ['bend:0.00', 'volume:1.00']);
        check('defaults have no tilt assignment', 'tilt' in DEFAULTS.device, false);
        check('an old stored tilt assignment is ignored (tilt "volume" / "bend": flat vs neck up sends nothing)', () => ['volume', 'bend'].map((tiltSetting) => {
          const h = new Guitar({ ...guitarOptions({ ...DEFAULTS.device, tilt: tiltSetting }, 'guitar'), tiltSmoothing: 0 });
          play(h, [], ctl(0, 0.44));
          return play(h, [], ctl(0, 1), { all: true });
        }), [[], []]);
      });

      await s.section('tilt smoothing (R4.5.1)', () => {
        check('tiltSmoothing default 80 ms', DEFAULTS.device.tiltSmoothing, 80);
        // Tilt on at 0.44, then a jump to 0.64 (+2 steps raw). With tau = 80 ms the
        // display offset after one 80 ms frame is 2 x (1 - e^-1) = 1.264.
        const after = (frames) => {
          const g = new Guitar(guitarOptions({ ...DEFAULTS.device }, 'guitar'));
          for (let t = 0; t < 1; t += 0.05) tilt(g, 0.44, t);
          tapBack(g, 0.44, 1);
          let t = 1;
          for (const dt of frames) { t += dt; tilt(g, 0.64, t); }
          return +g.displaySteps().toFixed(3);
        };
        check('one 80 ms frame after a jump of +2 steps: display 1.264 (EMA)', () => after([0.08]), 1.264);
        check('frame-rate independent: two 40 ms frames give the same', () => after([0.04, 0.04]), 1.264);
        check('tiltSmoothing 0 = off: the reading is taken as is (+2)', () => { const g = tg(); tilt(g, 0.44); tapBack(g, 0.44); tilt(g, 0.64, 0.016); return +g.displaySteps().toFixed(3); }, 2);
      });

      await s.section('number-field settings (R2.9.1)', () => s.withCleanStorage(() => {
        check('defaults: fade 500 ms, ring time 10 s, smoothing 80 ms, bend -2', [DEFAULTS.device.fadeMs, DEFAULTS.device.decay, DEFAULTS.device.tiltSmoothing, DEFAULTS.device.bendRange], [500, 10, 80, -2]);
        const device = fakeDevice('device:guitar:1', XPLORER);
        const panel = openPanel(device, 'guitar', 'guitar');
        try {
          const field = (key) => panel.el.querySelector(`[data-key="${key}"]`);
          const attrs = (key) => { const f = field(key); return f ? [f.tagName, f.type, f.min, f.max, f.step] : null; };
          check('fade-out field: number input 10..10000 step 50', attrs('fadeMs'), ['INPUT', 'number', '10', '10000', '50']);
          check('ring time field: number input 0.5..30 step 0.5', attrs('decay'), ['INPUT', 'number', '0.5', '30', '0.5']);
          check('tilt smoothing field: number input 0..1000 step 10', attrs('tiltSmoothing'), ['INPUT', 'number', '0', '1000', '10']);
          check('bend range field: number input -24..24 step 1', attrs('bendRange'), ['INPUT', 'number', '-24', '24', '1']);
          const enter = (key, value) => { const f = field(key); f.value = value; f.dispatchEvent(new Event('change', { bubbles: true })); panel.refresh(); return [ST.getDeviceSettings(device.id)[key], Number(field(key).value)]; };
          check('fade 300 is saved', () => enter('fadeMs', '300'), [300, 300]);
          check('fade 20000 is clamped to 10000', () => enter('fadeMs', '20000'), [10000, 10000]);
          check('fade 5 is clamped to 10', () => enter('fadeMs', '5'), [10, 10]);
          check('an empty (invalid) entry restores the previous value', () => enter('fadeMs', ''), [10, 10]);
          check('ring time 40 is clamped to 30', () => enter('decay', '40'), [30, 30]);
          check('bend range -30 is clamped to -24', () => enter('bendRange', '-30'), [-24, -24]);
          check('an invalid stored fade falls back to the default', () => { localStorage.setItem('musicSandbox.devices', JSON.stringify({ [device.id]: { fadeMs: 'x' } })); return ST.getDeviceSettings(device.id).fadeMs; }, 500);
        } finally {
          panel.destroy();
        }
      }));

      await s.section('tap-to-play in the settings menu (design 7.4)', () => {
        let g = new Guitar();
        g.setTapToPlay(true);
        check('fret press plays at once without strum', play(g, [press('fret1')]), ['on:52@0']);
        check('second fret adds its note (chord by tapping)', play(g, [press('fret3')]), ['on:57@2']);
        check('releasing a tapped fret stops its note', play(g, [release('fret1')]), ['off']);
        check('the release uses the mute fade', g.handle([release('fret3')], {}, 0).find((e) => e.type === 'noteOff')?.fade, g.options.fade);
        check('no voices left after releasing', g.ringingVoices().every((v) => v === null), true);
        play(g, [press('fret2')]);
        check('pressing the same fret again restarts it: off, then on', play(g, [release('fret2'), press('fret2')]), ['off', 'on:55@1']);
        g = new Guitar();
        play(g, [press('fret1')]);
        play(g, [strum]);
        play(g, [release('fret1'), release('strumDown')]);
        g.setTapToPlay(true);
        check('a strummed note keeps ringing when tap mode starts', g.ringingVoices()[0] !== null, true);
        check('pressing its fret in tap mode mutes it and plays the tapped note', play(g, [press('fret1')]), ['off', 'on:52@0']);
        g.setTapToPlay(false);
        check('after leaving tap mode, releasing the fret keeps the note ringing (R4.2)', play(g, [release('fret1')]), []);
        check('after leaving tap mode a fret press only mutes (R4.3)', play(g, [press('fret1')]), ['off']);
        check('and strum plays again', play(g, [strum]), ['on:52@0']);
        g = new Guitar(guitarOptions(DEFAULTS.device, 'bass', { gamepad: true }));
        g.setTapToPlay(true);
        check('gamepad bass mode: A taps E2', play(g, [press('faceA')]), ['on:40@0']);
        check('gamepad bass mode: releasing A stops it', play(g, [release('faceA')]), ['off']);
        check('tap mode is off by default', new Guitar().tapToPlay, false);
        g = new Guitar();
        g.setTapToPlay(false);
        check('tap mode off (mouse-opened panel): fret press alone plays nothing', play(g, [press('fret1')]), []);
        check('tap mode off: strum plays as usual', play(g, [strum]), ['on:52@0']);
        check('tap mode off: release keeps ringing (R4.2)', play(g, [release('fret1')]), []);
      });

      // ---- tilt range shifting (R4.5.2 - R4.5.7) ------------------------------
      await s.section('tilt shifts the fret range by scale steps (R4.5.2 - R4.5.7)', () => {
        check('constants: step size 0.1, hysteresis 0.2, limit 3 octaves, tilt starts off', [G.TILT_STEP_SIZE, G.TILT_STEP_HYSTERESIS, G.STEP_LIMIT_OCTAVES, G.TILT_STARTS_ENABLED], [0.1, 0.2, 3, false]);
        check('stepDelta rounds with hysteresis', () => [G.stepDelta(0.6, 0), G.stepDelta(0.75, 0), G.stepDelta(1.3, 1), G.stepDelta(0.35, 1), G.stepDelta(0.25, 1), G.stepDelta(-0.8, 0), G.stepDelta(2.9, 0)], [0, 1, 1, 1, 0, -1, 3]);
        check('shiftInScale from E3 in E minor pentatonic (+1 G3, +2 A3, +5 E4, -1 D3, -5 E2)', () => [1, 2, 5, -1, -5].map((n) => noteName(G.shiftInScale(52, SCALES.minorPentatonic, 0, n))), ['G3', 'A3', 'E4', 'D3', 'E2']);
        let g = tg();
        tilt(g, 0.44);
        check('tilt starts off: tilting does not move the range', (tilt(g, 0.95), notes(g)), ['E3', 'G3', 'A3', 'B3', 'D4']);
        tilt(g, 0.44);
        g.handle([press('back')], ctl(0, 0.44), 0);

      await s.section('D-pad action: menus, reset, drums, panel field (R4.15)', () => s.withCleanStorage(() => {

      // ---- strum hold (R4.7.2) ----------------------------------------------
      await s.section('strum hold (R4.7.2)', () => {
        const ends = (out) => ev(out, 'holdEnd').map((e) => e.voiceId).sort();
        let g = new Guitar();
        const out = g.handle([press('fret1'), strum], {}, 0);
        const on = ev(out, 'noteOn')[0] || {};
        check('a strum press sends noteOn with hold: true', on.hold, true);
        check('nothing more while the strum is held', play(g, [], {}, { t: 1 }).concat(ev(g.handle([], {}, 2), 'holdEnd')), []);
        check('the release sends holdEnd for that voice', ends(g.handle([release('strumDown')], {}, 3)), [on.voiceId]);
        g = new Guitar();
        const chord = ev(g.handle([press('fret1'), press('fret3'), strum], {}, 0), 'noteOn').map((e) => e.voiceId).sort();
        check('a chord: one holdEnd per voice', ends(g.handle([release('strumDown')], {}, 1)), chord);
        g = new Guitar();
        const both = g.handle([press('fret1'), strum, release('strumDown')], {}, 0);
        check('press and release in one frame send noteOn (hold) and holdEnd together', [ev(both, 'noteOn').map((e) => e.hold), ends(both).length], [[true], 1]);
        g = new Guitar();
        const pair = ev(g.handle([press('fret1'), press('fret2'), strum], {}, 0), 'noteOn');
        g.handle([release('fret1')], {}, 0.5);
        const mute = g.handle([press('fret1')], {}, 1);
        check('a fret press while held mutes (noteOff) ...', ev(mute, 'noteOff').map((e) => e.voiceId), [pair[0]?.voiceId]);
        check('... and no holdEnd follows for that voice', ends(g.handle([release('strumDown')], {}, 2)), [pair[1]?.voiceId]);
        g = new Guitar();
        const first = ev(g.handle([press('fret1'), strum], {}, 0), 'noteOn')[0] || {};
        const re = g.handle([press('strumUp')], {}, 1);
        const second = ev(re, 'noteOn')[0] || {};
        check('the other strum direction restrums: old voice noteOff, new voice held', [ev(re, 'noteOff').map((e) => e.voiceId), second.hold, second.voiceId !== first.voiceId], [[first.voiceId], true, true]);
        check('releasing one direction sends no holdEnd while the other is held', ends(g.handle([release('strumDown')], {}, 2)), []);
        check('holdEnd comes when both are released (new voice only)', ends(g.handle([release('strumUp')], {}, 3)), [second.voiceId]);
        g = new Guitar();

        check('releaseStrumHold (menu opened) sends the holdEnds at once', () => ends(g.releaseStrumHold(1) || []), [held.voiceId]);
        check('the later release sends nothing', ends(g.handle([release('strumDown')], {}, 2)), []);
        g = new Guitar();

        const gp = ev(g.handle([press('faceA'), press('dpadUp')], {}, 0), 'noteOn')[0] || {};
        check('gamepad guitar mode: D-pad up held -> hold, release -> holdEnd', [gp.hold, ends(g.handle([release('dpadUp')], {}, 1))], [true, [gp.voiceId]]);
        check('the keyboard guitar keys (Backspace = strum) behave the same', () => {
          const k = new KEYS.Keys({ guitar: guitarOptions({ ...DEFAULTS.device }, 'guitar') });
          const kon = ev(k.handle([press('fret1'), press('strum')], {}, 0), 'noteOn')[0] || {};

      });

      await s.section('strum hold and MIDI note length in the level estimate (R4.7, R4.7.2, VoiceTracker)', () => {
        const tracker = (settings, source, instrument = 'guitar') => new AE.VoiceTracker(AE.trackerConfig(guitarSound({ ...DEFAULTS.device, ...settings }, instrument, source)));
        const near = (a, b, tol = 0.02) => Math.abs(a - b) <= tol * Math.max(Math.abs(a), Math.abs(b), 1e-9);
        let tr = tracker({}, 'pluck');
        tr.noteOn({ voiceId: 1, midi: 52, velocity: 127, hold: true }, 0);
        check('a held pluck voice stays at level 1 for 20 s', [tr.level(1, 0.1), tr.level(1, 10), tr.level(1, 20)].map((v) => +v.toFixed(3)), [1, 1, 1]);
        tr.holdEnd({ voiceId: 1 }, 20);
        check('after holdEnd it decays from the holdEnd time with the ring time (-30 dB after 5 s of 10 s)', () => near(tr.level(1, 25), Math.pow(0.001, 0.5), 0.05), true);
        tr = tracker({}, 'midi');
        tr.noteOn({ voiceId: 1, midi: 52, velocity: 100, hold: true }, 0);
        tr.noteOn({ voiceId: 2, midi: 52, velocity: 100 }, 0);
        check('a held MIDI voice has the same estimate as an unheld one', [3, 8].map((t) => near(tr.level(1, t), tr.level(2, t), 1e-6)), [true, true]);
        check('with the MIDI source a fret release sends no noteOff', () => {
          const { instrument } = SETUP.createInstrument(fakeDevice('device:guitar:1', XPLORER), 'guitar', { ...DEFAULTS.device, source: 'midi' });
          instrument.handle([press('fret1'), strum], {}, 0);
          return summarize(instrument.handle([release('fret1'), release('strumDown')], {}, 1)).filter((e) => e === 'off');
        }, []);
        // Program 19 (Church Organ) sustains: the estimate keeps its level until noteOff.
        tr = tracker({ source: 'midi', program: 19 }, 'midi');
        tr.noteOn({ voiceId: 1, midi: 52, velocity: 127 }, 0);
        tr.active(30);
        check('sustaining program: full level after 60 s without noteOff', () => near(tr.level(1, 60), tr.level(1, 0.01)), true);
        const g = new Guitar(guitarOptions({ ...DEFAULTS.device, source: 'midi' }, 'guitar'));
        g.handle([press('fret1'), strum], {}, 0);
        g.handle([release('fret1')], {}, 1);
        const offEv = ev(g.handle([press('fret1')], {}, 60), 'noteOff')[0];
        if (offEv) tr.noteOff({ ...offEv, voiceId: 1 }, 60);
        check('... it fades only after the fret is pressed again (gone 2.5 s later)', [!!offEv, tr.level(1, 62.5)], [true, 0]);
        const short = tracker({ source: 'midi', program: 27, decay: 2 }, 'midi');
        const long = tracker({ source: 'midi', program: 27, decay: 30 }, 'midi');
        short.noteOn({ voiceId: 1, midi: 52, velocity: 100 }, 0);
        long.noteOn({ voiceId: 1, midi: 52, velocity: 100 }, 0);
        check('the ring time does not change the level estimate of a MIDI voice', near(short.level(1, 5), long.level(1, 5), 1e-6), true);
        check('the MIDI source config carries no decay', () => 'decay' in guitarSound({ ...DEFAULTS.device, source: 'midi' }, 'guitar', 'midi'), false);
        check('ring time default 10 s for the pluck sound (bass x1.5)', () => [guitarSound({ ...DEFAULTS.device }, 'guitar', 'pluck').decay, guitarSound({ ...DEFAULTS.device }, 'bass', 'pluck').decay], [10, 15]);
      });

      await s.section('highway trails follow the level estimate (R5.4.2)', () => {
        const tr = new AE.VoiceTracker(AE.trackerConfig(guitarSound({ ...DEFAULTS.device, source: 'midi', program: 19 }, 'guitar', 'midi')));
        const hw = new HV.HighwayState();
        const e = { type: 'noteOn', voiceId: 7, midi: 52, velocity: 127, column: 0 };
        tr.noteOn(e, 0);
        hw.noteOn(e, tr, { x: 0.1, color: '#fff' }, 0);
        for (let t = 0; t <= 60; t += 0.5) { tr.active(t); hw.update(t); }
        check('an organ note without noteOff still has an open trail after 60 s', hw.notes.map((n) => n.end), [null]);
        const p = new AE.VoiceTracker(AE.trackerConfig(guitarSound({ ...DEFAULTS.device }, 'guitar', 'pluck')));
        const hp = new HV.HighwayState();
        p.noteOn(e, 0);
        hp.noteOn(e, p, { x: 0.1, color: '#fff' }, 0);
        let endAt = null;
        for (let t = 0; t <= 20; t += 0.25) { p.active(t); hp.update(t); if (endAt === null && hp.notes[0]?.end != null) endAt = t; }
        check('a pluck note trail ends when its voice falls below 2 % (about 5.7 s of a 10 s ring time)', endAt !== null && endAt > 5 && endAt < 6.5, true);
      });

      await s.section('tilt glide in the MIDI source (fake synth, R4.14)', async () => {
        const param = () => ({ value: 0, setValueAtTime(v) { this.value = v; }, setTargetAtTime(v) { this.value = v; }, linearRampToValueAtTime(v) { this.value = v; }, cancelScheduledValues() {} });
        const fakeSynth = {
          bend: [0], notetab: [],
          send(msg) {
            const cmd = msg[0] & 0xf0;
            if (cmd === 0x90) this.notetab.push({ ch: 0, n: msg[1], o: [{ frequency: {}, detune: Object.assign(param(), { value: this.bend[0] }) }, { playbackRate: {}, detune: param() }] });
            if (cmd === 0xe0) { this.bend[0] = ((msg[1] + (msg[2] << 7)) - 8192) * 200 / 8192; for (const nt of this.notetab) for (const o of nt.o) if (o.frequency) o.detune.setValueAtTime(this.bend[0]); }
          },
          setBendRange() {}, setProgram() {},
        };
        const ctx = new OfflineAudioContext(1, 4800, 48000);
        ctx.resume = () => Promise.resolve(); // the synth library resumes its context; an offline one cannot be resumed before rendering
        const ms = new MS.MidiSource(ctx, ctx.destination, { drums: false, program: 27, bendRange: -2 });
        await ms.ready;
        ms.synth = fakeSynth;
        const detune = (i) => fakeSynth.notetab[i]?.o[0].detune.value;
        ms.noteOn(1, 57, 100, { glide: 1 });
        check('noteOn with glide +1: detune 100', detune(0), 100);
        ms.bend(-1);
        check('a bend of -1 with glide +1 gives 0', [fakeSynth.bend[0], detune(0)], [-100, 0]);
        ms.glide(1, 3.5);
        check('glide 3.5 on top of bend -1 gives 250 (no bend-range limit)', detune(0), 250);
        check('noise (unpitched) oscillators are untouched', fakeSynth.notetab[0]?.o[1].detune.value, 0);
        ms.noteOn(2, 60, 100, {});
        check('a note without glide gets only the bend', detune(1), -100);
      });

      await s.section('tiltGlide setting and where it is shown (R4.14)', () => s.withCleanStorage(() => {
        const id = 'device:guitar:1';
        check('tiltGlide default off', [DEFAULTS.device.tiltGlide, ST.getDeviceSettings(id).tiltGlide], [false, false]);
        ST.setDeviceSetting(id, 'tiltGlide', true);
        check('saved per device', ST.getDeviceSettings(id).tiltGlide, true);
        ST.resetDeviceSettings(id, { keepInstrument: true });
        check('cleared by the reset', ST.getDeviceSettings(id).tiltGlide, false);
        localStorage.setItem('musicSandbox.devices', JSON.stringify({ [id]: { tiltGlide: 'yes' } }));
        check('invalid stored value -> off', ST.getDeviceSettings(id).tiltGlide, false);
        localStorage.clear();
        const has = (device, kind, instrument) => { const p = openPanel(device, kind, instrument); try { return !!p.el.querySelector('input[type="checkbox"][data-key="tiltGlide"]'); } finally { p.destroy(); } };
        check('the checkbox is offered on a guitar lane and a guitar playing bass (with tilt)', () => [has(fakeDevice(id, XPLORER), 'guitar', 'guitar'), has(fakeDevice(id, XPLORER), 'guitar', 'bass')], [true, true]);
        check('no checkbox for a gamepad (no tilt) or drums', () => [has(fakeDevice('device:gamepad:1', PAD), 'guitar', 'guitar'), has(fakeDevice(id, XPLORER), 'drums', 'drums')], [false, false]);
      }));

      await s.section('mute fade-out and ring time hints (R4.3.1, R4.7.1)', () => s.withCleanStorage(() => {
        const hintOf = (key) => { const p = openPanel(fakeDevice('device:guitar:1', XPLORER), 'guitar', 'guitar'); try { const f = p.el.querySelector(`[data-key="${key}"]`); return f?.closest('label')?.querySelector('.field-hint')?.textContent ?? null; } finally { p.destroy(); } };
        check('mute fade-out field has its hint', () => hintOf('fadeMs'), I18N.t('settings.fadeHint'));
        check('ring time field has its hint', () => hintOf('decay'), I18N.t('settings.decayHint'));
        check('both hints are translated', () => [I18N.t('settings.fadeHint') !== 'settings.fadeHint', I18N.t('settings.decayHint') !== 'settings.decayHint'], [true, true]);
      }));

      s.finish();
    </script>
  </body>
</html>
