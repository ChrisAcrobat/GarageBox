# Tests the app and deploys it to GitHub Pages (design 10).
# The test job opens every tests/*.test.html page in headless Chromium and
# fails on any FAIL or timeout; deploy only runs when it passed.
# Node.js and Playwright are used only inside this job, never as an app build
# step. Only the app in src/ is published; README.md, docs/, tests/ and other
# non-app files live outside src/ and are left out (R7.3). No build step.
name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium (CI only)
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Serve the repository root
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/tests/index.html > /dev/null && exit 0
            sleep 1
          done
          echo "static server did not start"; cat /tmp/http.log; exit 1

      - name: Run every test page (all at once, 60 s each)
        run: node tests/run-headless.mjs --base-url http://127.0.0.1:8000/ --timeout 60000

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect app files
        run: |
          mkdir _site
          cp -r src/. _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
