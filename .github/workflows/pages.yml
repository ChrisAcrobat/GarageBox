# Deploys the app to GitHub Pages.
# Only the files the app needs are published; README.md, docs/, tests/
# and other non-app files are left out (R7.3). No build step is involved.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect app files
        run: |
          mkdir _site
          for path in index.html css js lang vendor; do
            if [ -e "$path" ]; then cp -r "$path" _site/; fi
          done
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
