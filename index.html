<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GarageBox – local launch</title>
    <link rel="icon" href="data:," />
    <style>
      body { font: 16px/1.45 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: #e8e8e8; background: #12141a; }
      a { color: #7cb8ff; }
      code { font-size: 0.9em; }
      .muted { color: #9aa3b2; }
    </style>
    <script>
      const APP = 'http://127.0.0.1:5501/';
      const BLUEPRINTS = 'http://127.0.0.1:5502/';

      async function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

      (async function () {
        // App (:5501) and Blueprints (:5502) are started as folderOpen tasks.
        await wait(1200);
        try { window.open(APP, '_blank', 'noopener'); } catch (_) {}
        location.replace(BLUEPRINTS);
      })();
    </script>
  </head>
  <body>
    <h1>Opening local pages…</h1>
    <p class="muted">App on <code>:5501</code> (new tab), then this tab goes to Blueprints on <code>:5502</code>.</p>
    <p>If a popup is blocked, use:
      <a id="app" href="http://127.0.0.1:5501/" target="_blank" rel="noopener">App</a>
      ·
      <a id="bp" href="http://127.0.0.1:5502/">Blueprints</a>
    </p>
  </body>
</html>
