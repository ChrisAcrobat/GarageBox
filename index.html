<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GarageBox – local launch</title>
    <link rel="icon" href="data:," />
    <style>
      body { font: 16px/1.45 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: #e8e8e8; background: #12141a; }
      a { color: #7cb8ff; }
      code { font-size: 0.9em; }
      .muted { color: #9aa3b2; }
    </style>
    <script>
      // Open Blueprints in a new tab, then continue this tab to the app under /src/.
      // Works when Live Preview (or any static server) uses the repository root as web root.
      (function () {
        const blueprints = '/docs/blueprints/';
        const app = '/src/';
        try { window.open(blueprints, '_blank', 'noopener'); } catch (_) {}
        location.replace(app);
      })();
    </script>
  </head>
  <body>
    <h1>Opening local pages…</h1>
    <p class="muted">Blueprints should open in a new tab. This tab goes to the app.</p>
    <p>If nothing happens (popup blocked), use:
      <a href="/docs/blueprints/" target="_blank" rel="noopener">Blueprints</a>
      ·
      <a href="/src/">App</a>
    </p>
  </body>
</html>
